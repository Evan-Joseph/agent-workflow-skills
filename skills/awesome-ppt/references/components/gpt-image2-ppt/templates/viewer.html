<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="离线渲染幻灯片全屏放映器，支持键盘翻页、自动轮播与触控切换。">
    <title>PPT播放器</title>
    <style>
        /* Hallmark · checked: 2026-11-26 · shape: app screen · genre: modern-minimal · built: the project · redesign: polish · v2.0.0 */
        :root {
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --stage-bg: #0b0d11;
            --hud-bg: #161920;
            --hud-border: rgba(242, 244, 248, 0.14);
            --hud-fg: #f2f4f8;
            --hud-muted: #9aa2b1;
            --hud-focus: #5e8bff;
            --hud-disabled-bg: #111318;
        }

        [data-theme="light"] {
            --stage-bg: #f4f5f7;
            --hud-bg: #fcfcfd;
            --hud-border: rgba(20, 24, 31, 0.12);
            --hud-fg: #181b20;
            --hud-muted: #5e6673;
            --hud-focus: #2152e7;
            --hud-disabled-bg: #eceef2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: clip;
        }

        body {
            overflow-y: hidden;
            background: var(--stage-bg);
            color: var(--hud-fg);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--hud-focus);
            outline-offset: 2px;
        }

        button:active {
            opacity: 0.82;
        }

        button:disabled {
            background: var(--hud-disabled-bg);
            color: var(--hud-muted);
            cursor: not-allowed;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .slide {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .slide.active {
            display: block;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--hud-bg);
            border: 1px solid var(--hud-border);
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--hud-fg);
            font-size: 13px;
            line-height: 1.4;
            z-index: 100;
            transition: opacity 0.2s ease;
            white-space: nowrap;
            max-width: calc(100% - 32px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controls.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--hud-bg);
            border: 1px solid var(--hud-border);
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--hud-fg);
            font-family: var(--font-mono);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            z-index: 100;
            transition: opacity 0.2s ease;
        }

        .indicator.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--hud-muted);
            font-size: 15px;
            z-index: 200;
        }

        @media (prefers-reduced-motion: reduce) {
            .controls,
            .indicator {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="slideContainer" tabindex="0" aria-label="幻灯片画布">
        <!-- 图片将通过JS动态插入 -->
    </div>

    <div class="indicator" id="indicator">
        <span id="current">1</span> / <span id="total">0</span>
    </div>

    <div class="controls" id="controls">
        方向键翻页 / 上下首末页 / ESC 全屏 / 空格自动播放 / H 显隐控件
    </div>

    <div class="loading" id="loading">加载中…</div>

    <script>
        // 图片列表将通过替换占位符注入
        const slides = [/* IMAGE_LIST_PLACEHOLDER */];
        let currentSlide = 0;
        let autoPlayInterval = null;
        let isAutoPlaying = false;
        let controlsVisible = true;

        function init() {
            const container = document.getElementById('slideContainer');
            const loading = document.getElementById('loading');

            if (slides.length === 0) {
                loading.textContent = '未找到幻灯片图片';
                return;
            }

            slides.forEach((src, index) => {
                const img = document.createElement('img');
                img.src = src;
                img.className = 'slide' + (index === 0 ? ' active' : '');
                img.alt = `幻灯片 ${index + 1}`;
                img.onerror = function() {
                    console.error(`Failed to load image: ${src}`);
                };
                container.appendChild(img);
            });

            document.getElementById('total').textContent = slides.length;
            updateIndicator();

            loading.style.display = 'none';

            setTimeout(() => {
                hideControls();
            }, 3000);
        }

        function showSlide(index) {
            const allSlides = document.querySelectorAll('.slide');

            if (index < 0 || index >= slides.length) {
                return;
            }

            allSlides.forEach(s => s.classList.remove('active'));
            allSlides[index].classList.add('active');
            currentSlide = index;
            updateIndicator();

            showControls();

            setTimeout(() => {
                hideControls();
            }, 3000);
        }

        function updateIndicator() {
            document.getElementById('current').textContent = currentSlide + 1;
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                showSlide(currentSlide + 1);
            } else if (isAutoPlaying) {
                showSlide(0);
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                showSlide(currentSlide - 1);
            } else if (isAutoPlaying) {
                showSlide(slides.length - 1);
            }
        }

        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen();
            }
        }

        function toggleAutoPlay() {
            if (isAutoPlaying) {
                stopAutoPlay();
            } else {
                startAutoPlay();
            }
        }

        function startAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
            }
            autoPlayInterval = setInterval(() => {
                nextSlide();
            }, 3000);
            isAutoPlaying = true;
            updateControlsText();
        }

        function stopAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            }
            isAutoPlaying = false;
            updateControlsText();
        }

        function updateControlsText() {
            const controls = document.getElementById('controls');
            const playText = isAutoPlaying ? '暂停' : '自动播放';
            controls.textContent = `方向键翻页 / 上下首末页 / ESC 全屏 / 空格${playText} / H 显隐控件`;
        }

        function hideControls() {
            if (controlsVisible) {
                document.getElementById('indicator').classList.add('hidden');
                document.getElementById('controls').classList.add('hidden');
                controlsVisible = false;
            }
        }

        function showControls() {
            if (!controlsVisible) {
                document.getElementById('indicator').classList.remove('hidden');
                document.getElementById('controls').classList.remove('hidden');
                controlsVisible = true;
            }
        }

        function toggleControls() {
            if (controlsVisible) {
                hideControls();
            } else {
                showControls();
            }
        }

        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowLeft':
                    prevSlide();
                    stopAutoPlay();
                    break;
                case 'ArrowRight':
                    nextSlide();
                    stopAutoPlay();
                    break;
                case 'ArrowUp':
                case 'Home':
                    showSlide(0);
                    stopAutoPlay();
                    break;
                case 'ArrowDown':
                case 'End':
                    showSlide(slides.length - 1);
                    stopAutoPlay();
                    break;
                case 'Escape':
                    toggleFullscreen();
                    break;
                case ' ':
                    e.preventDefault();
                    toggleAutoPlay();
                    break;
                case 'h':
                case 'H':
                    toggleControls();
                    break;
            }
        });

        let mouseTimer = null;
        document.addEventListener('mousemove', () => {
            showControls();

            if (mouseTimer) {
                clearTimeout(mouseTimer);
            }

            mouseTimer = setTimeout(() => {
                hideControls();
            }, 3000);
        });

        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            const swipeThreshold = 50;

            if (touchEndX < touchStartX - swipeThreshold) {
                nextSlide();
                stopAutoPlay();
            }

            if (touchEndX > touchStartX + swipeThreshold) {
                prevSlide();
                stopAutoPlay();
            }
        }

        init();
    </script>
</body>
</html>
